submission:
  title: "Clinical Trial Risk Monitor & Protocol Deviation Detector"

  problem_statement: >
    Clinical trial sites generate thousands of patient visit records that must
    comply with strict protocol specifications. Manual review is slow, error-prone,
    and fails to surface high-risk sites before regulatory audits, putting trial
    integrity and patient safety at risk.

  solution_summary: >
    An AI-powered monitoring platform that automatically compares patient visit
    records against protocol specifications, detects and classifies deviations
    (Major/Minor/Administrative), calculates site-level risk scores, and generates
    CAPA-ready reports — all accessible through IBM Bob via a custom MCP server.

  key_features:
    - "Automated protocol deviation detection across 5,000+ patient visits and 200+ sites"
    - "AI severity classification (Major/Minor/Administrative) using Hugging Face models"
    - "Site risk scoring and ranking with Redis-cached results and trend analysis"
    - "LLM-powered CAPA report generation via IBM watsonx.ai Granite model"
    - "IBM Bob MCP integration with 8 tools for real-time clinical trial analysis"

  tech_stack:
    languages: ["TypeScript", "JavaScript"]
    frameworks: ["React", "Express", "Tailwind CSS", "Vite"]
    ibm_technologies: ["IBM Bob", "watsonx.ai"]
    databases: ["MongoDB", "Redis", "ChromaDB"]
    other: ["Docker", "Docker Compose", "Zod", "Mongoose", "GitHub Actions"]

  what_we_are_most_proud_of: >
    The IBM Bob MCP integration — 8 purpose-built tools that make Bob a genuine
    load-bearing component, enabling natural language queries over live clinical
    trial data, deviation detection, risk scoring, and CAPA report generation
    directly from the Bob IDE.

  known_limitations: >
    The severity classifier uses zero-shot classification pending fine-tuning on
    clinical trial data. CAPA report generation requires a valid watsonx.ai or
    OpenAI API key; without one, stub responses are returned. The demo uses
    synthetic data only — no real patient data is included.

